<!doctype html>
<!--
  Nessa default artifact theme.
  This file is the one place that declares the design tokens (the --custom
  properties in the first :root block) and every component style.
  scripts/render.py fills the {{...}} slots. A theme override never edits
  this file: it sets token values, which render.py writes into THEME_CSS
  after these defaults, so only the keys it sets change.
-->
<html lang="en" data-theme-name="{{THEME_NAME}}"{{STYLE_ATTRS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="nessa build-artifacts">
<script>document.documentElement.classList.add("js")</script>
<title>{{TITLE}}</title>
<style>
/* ---------- Design tokens: light (default) ---------- */
:root {
  /* color */
  --color-bg: #fbfaf7;
  --color-surface: #ffffff;
  --color-surface-2: #f3f1ec;
  --color-text: #1c1b19;
  --color-muted: #66625a;
  --color-border: #e3dfd6;
  --color-accent: #3a52c8;
  --color-accent-ink: #ffffff;
  --color-has: #1f7a4d;
  --color-partial: #9a5b06;
  --color-missing: #b3261e;
  --color-sourced: #2b6688;
  --color-judgment: #6f45a8;
  --color-placeholder: #806200;
  --color-code-bg: #f3f1ec;
  /* derived: follow the base colors, so an override of one updates these */
  --color-accent-soft: color-mix(in srgb, var(--color-accent) 10%, var(--color-surface));
  --color-has-soft: color-mix(in srgb, var(--color-has) 12%, var(--color-surface));
  --color-partial-soft: color-mix(in srgb, var(--color-partial) 13%, var(--color-surface));
  --color-missing-soft: color-mix(in srgb, var(--color-missing) 11%, var(--color-surface));
  --color-sourced-soft: color-mix(in srgb, var(--color-sourced) 11%, var(--color-surface));
  --color-judgment-soft: color-mix(in srgb, var(--color-judgment) 11%, var(--color-surface));
  --color-placeholder-soft: color-mix(in srgb, var(--color-placeholder) 12%, var(--color-surface));

  /* type */
  --font-body: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-heading: var(--font-body);
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;
  --text-3xl: 2.25rem;
  --leading: 1.6;
  --leading-tight: 1.25;
  --weight-heading: 650;

  /* space and shape */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --space-8: 4rem;
  --measure: 46rem;
  --toc-width: 14rem;
  --radius: 10px;
  --radius-sm: 6px;
  --border-width: 1px;
  --shadow: none;
}

/* ---------- Design tokens: dark (screen only; print stays light) ---------- */
@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #141413;
    --color-surface: #1c1c1a;
    --color-surface-2: #252522;
    --color-text: #ecebe6;
    --color-muted: #a29e94;
    --color-border: #34332f;
    --color-accent: #8ea0ff;
    --color-accent-ink: #10131f;
    --color-has: #5cc08a;
    --color-partial: #e3a548;
    --color-missing: #f07a70;
    --color-sourced: #79b6da;
    --color-judgment: #b99ae6;
    --color-placeholder: #d9b64a;
    --color-code-bg: #252522;
    --shadow: none;
  }
}
@media screen {
:root[data-theme="dark"] {
  --color-bg: #141413;
  --color-surface: #1c1c1a;
  --color-surface-2: #252522;
  --color-text: #ecebe6;
  --color-muted: #a29e94;
  --color-border: #34332f;
  --color-accent: #8ea0ff;
  --color-accent-ink: #10131f;
  --color-has: #5cc08a;
  --color-partial: #e3a548;
  --color-missing: #f07a70;
  --color-sourced: #79b6da;
  --color-judgment: #b99ae6;
  --color-placeholder: #d9b64a;
  --color-code-bg: #252522;
  --shadow: none;
}
}
</style>
<style id="theme-overrides">
{{THEME_CSS}}
</style>
<style>
/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading);
  text-rendering: optimizeLegibility;
}
main { max-width: var(--measure); margin: 0 auto; }
.layout { margin: 0 auto; padding: var(--space-7) var(--space-5) var(--space-8); }
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--weight-heading); line-height: var(--leading-tight); letter-spacing: -0.01em; }
h1 { font-size: var(--text-3xl); margin: var(--space-2) 0 var(--space-4); letter-spacing: -0.02em; }
h2 { font-size: var(--text-2xl); margin: var(--space-7) 0 var(--space-2); padding-top: var(--space-5); border-top: var(--border-width) solid var(--color-border); }
h3 { font-size: var(--text-xl); margin: var(--space-6) 0 var(--space-2); }
h4 { font-size: var(--text-lg); margin: var(--space-5) 0 var(--space-2); }
p { margin: 0 0 var(--space-4); }
a { color: var(--color-accent); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
strong { font-weight: 650; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--color-code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
pre { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--color-code-bg); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-sm); padding: var(--space-4); overflow-x: auto; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: inherit; }
ul, ol { margin: 0 0 var(--space-4); padding-left: 1.4em; }
li { margin: var(--space-1) 0; }
li::marker { color: var(--color-muted); }
blockquote { margin: 0 0 var(--space-4) var(--space-5); padding: 0; color: var(--color-muted); }
blockquote p:last-child { margin-bottom: 0; }
hr { border: none; border-top: var(--border-width) solid var(--color-border); margin: var(--space-6) 0; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/*
  Nessa default style rules (hard bans): no colored bar down the side of
  anything, and no pills, badges, chips, dots or colored label backgrounds.
  Labels, status and ranks are plain text. A theme can opt back in through
  [components.style]; those styles sit at the end of this file, scoped to the
  html data- attributes, and the default never sets them.
*/

/* ---------- Header ---------- */
.doc-header { margin-bottom: var(--space-6); }
.eyebrow { font-size: var(--text-sm); font-variant-caps: all-small-caps; letter-spacing: 0.06em; color: var(--color-muted); margin: 0; }
.summary { font-size: var(--text-lg); color: var(--color-muted); margin: 0 0 var(--space-4); line-height: 1.5; }
.meta { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); font-size: var(--text-sm); color: var(--color-muted); margin: 0; padding: 0; list-style: none; }
.meta li { margin: 0; }

/* ---------- Table of contents ---------- */
.toc { border-top: var(--border-width) solid var(--color-border); border-bottom: var(--border-width) solid var(--color-border); padding: var(--space-4) 0; margin: 0 0 var(--space-6); }
.toc h2 { font-size: var(--text-sm); font-variant-caps: all-small-caps; letter-spacing: 0.06em; font-weight: 600; color: var(--color-muted); border: 0; padding: 0; margin: 0 0 var(--space-2); }
.toc ol { columns: 2; column-gap: var(--space-6); margin: 0; padding-left: 1.3em; font-size: var(--text-sm); }
.toc li { break-inside: avoid; margin: 0 0 var(--space-1); }
.toc a { color: var(--color-text); text-decoration: none; }
.toc a:hover { color: var(--color-accent); text-decoration: underline; }

/* ---------- Labels and status: plain text ---------- */
.provenance { font-style: italic; font-weight: 400; color: var(--color-muted); }
.caption > .provenance { font-style: italic; }
.caption > .provenance::after { content: "."; }
.caption > .provenance + .provenance::before { content: " "; }
.status { font-weight: 650; color: var(--color-text); }

/* ---------- Section caption ---------- */
.caption { font-size: var(--text-sm); color: var(--color-muted); margin: 0 0 var(--space-4); }

/* ---------- Lead and notes ---------- */
.lead { border: var(--border-width) solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); padding: var(--space-5) var(--space-5) var(--space-4); margin: var(--space-5) 0 var(--space-6); }
.lead-label { font-size: var(--text-sm); margin: 0 0 var(--space-2); color: var(--color-muted); }
.lead-label .name { font-variant-caps: all-small-caps; letter-spacing: 0.06em; font-weight: 650; color: var(--color-text); margin-right: var(--space-2); }
.lead > :last-child { margin-bottom: 0; }
.lead p { font-size: var(--text-lg); line-height: 1.5; }
.note { background: var(--color-surface-2); border-radius: var(--radius); padding: var(--space-3) var(--space-4); margin: var(--space-4) 0; font-size: var(--text-sm); }
.note > :last-child { margin-bottom: 0; }
.note-label { font-weight: 650; margin: 0 0 var(--space-1); }

/* ---------- Quotes ---------- */
figure.quote { margin: 0 0 var(--space-5) var(--space-5); padding: 0; }
figure.quote blockquote { margin: 0; color: var(--color-text); font-size: var(--text-lg); line-height: 1.5; }
figure.quote blockquote p::before { content: "\201C"; margin-left: -0.45em; }
figure.quote blockquote p:last-child::after { content: "\201D"; }
figure.quote figcaption { margin-top: var(--space-1); font-size: var(--text-sm); color: var(--color-muted); }
figure.quote figcaption .who { color: var(--color-text); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 0 0 var(--space-5); }
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); line-height: 1.45; }
th, td { text-align: left; vertical-align: top; padding: var(--space-3) var(--space-4) var(--space-3) 0; border-bottom: var(--border-width) solid var(--color-border); }
th:last-child, td:last-child { padding-right: 0; }
thead th { border-bottom: 1.5px solid var(--color-text); font-size: var(--text-sm); font-variant-caps: all-small-caps; letter-spacing: 0.05em; color: var(--color-muted); font-weight: 650; }
td:first-child { font-weight: 600; }
.state-table td:first-child { font-family: var(--font-mono); font-weight: 500; font-size: 0.92em; white-space: nowrap; }

/* ---------- Ranked list: plain numerals ---------- */
ol.ranked { list-style: none; counter-reset: rank; padding: 0; }
ol.ranked > li { counter-increment: rank; position: relative; padding: var(--space-3) 0 var(--space-3) 2.2rem; margin: 0; }
ol.ranked > li::before { content: counter(rank) "."; position: absolute; left: 0; top: var(--space-3); font-family: var(--font-heading); font-size: var(--text-lg); font-weight: 600; line-height: var(--leading-tight); color: var(--color-muted); font-variant-numeric: tabular-nums; }
ol.ranked strong:first-child { display: block; font-size: var(--text-lg); line-height: var(--leading-tight); margin-bottom: var(--space-1); }

/* ---------- Idea cards ---------- */
.idea-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); margin: 0 0 var(--space-5); }
.idea-grid.stack, .idea-grid.count-1 { grid-template-columns: 1fr; }
/* An odd card out spans the row and lays its fields in two columns, so it never sits alone in half the width. */
.idea-grid:not(.stack) > .idea:last-child:nth-child(odd):not(:first-child) { grid-column: 1 / -1; }
.idea-grid:not(.stack) > .idea:last-child:nth-child(odd):not(:first-child) dl { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--space-5); }
.idea-grid:not(.stack) > .idea:last-child:nth-child(odd):not(:first-child) dl > .field-pitch { grid-column: 1 / -1; }
.idea { background: var(--color-surface); border: var(--border-width) solid var(--color-border); border-radius: var(--radius); padding: var(--space-4) var(--space-5); box-shadow: var(--shadow); break-inside: avoid; }
.idea header { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2); }
.idea header .provenance { font-size: var(--text-sm); }
.idea h3 { margin: 0; font-size: var(--text-lg); }
.idea dl { margin: 0; }
.idea dl > div { padding: var(--space-2) 0; border-top: var(--border-width) solid var(--color-border); }
.idea dt { font-size: var(--text-sm); font-variant-caps: all-small-caps; letter-spacing: 0.06em; color: var(--color-muted); font-weight: 650; margin-bottom: 0.1em; }
.idea dd { margin: 0; font-size: var(--text-sm); line-height: 1.5; }
.idea dd p { margin: 0; }
.idea dl > div.field-pitch dd { font-size: var(--text-base); font-weight: 500; }

/* ---------- Diagram ---------- */
figure.diagram { margin: 0 0 var(--space-5); border: var(--border-width) solid var(--color-border); border-radius: var(--radius); padding: var(--space-4); }
figure.diagram pre.mermaid { background: none; border: none; padding: 0; margin: 0; text-align: center; }
figure.diagram pre.mermaid:not([data-processed]) { text-align: left; color: var(--color-muted); }
figure.diagram figcaption { font-size: var(--text-sm); color: var(--color-muted); margin-top: var(--space-3); }

/* ---------- Invariants, risks, questions, skip: plain lists ---------- */
ol.invariants { list-style: none; counter-reset: inv; padding: 0; }
ol.invariants > li { counter-increment: inv; padding: var(--space-2) 0 var(--space-2) 2.2rem; position: relative; margin: 0; border-bottom: var(--border-width) solid var(--color-border); }
ol.invariants > li:first-child { border-top: var(--border-width) solid var(--color-border); }
ol.invariants > li::before { content: "I" counter(inv); position: absolute; left: 0; top: var(--space-2); font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-muted); }
ul.marked { list-style: disc; padding-left: 1.3em; }
ul.marked > li { margin: var(--space-2) 0; }

/* ---------- Sources ---------- */
ul.sources { list-style: disc; padding-left: 1.3em; font-size: var(--text-sm); }
ul.sources > li { margin: var(--space-2) 0; }

.doc-footer { margin-top: var(--space-8); padding-top: var(--space-4); border-top: var(--border-width) solid var(--color-border); font-size: var(--text-xs); color: var(--color-muted); }

/* ---------- Sidebar contents (left by default, or right) ----------
   Plain text only: no side bar, no accent border, no pill or dot. The current
   section is shown by weight and text color. With JS off the sidebar is a
   static list (beside the text on wide screens, above it on narrow ones). */
.toc-side { font-size: var(--text-sm); line-height: 1.4; margin: 0 0 var(--space-6); }
.toc-head { display: flex; align-items: center; justify-content: flex-start; gap: 0.4em; margin-bottom: var(--space-2); }
.toc-title { margin: 0; font-variant-caps: all-small-caps; letter-spacing: 0.06em; font-weight: 650; color: var(--color-muted); }
.toc-close { margin-left: auto; }
.toc-side ol { list-style: none; margin: 0; padding: 0; }
.toc-side li { margin: 0; }
.toc-side ol ol { padding-left: var(--space-3); }
.toc-side a { display: block; padding: 0.3em 0; color: var(--color-muted); text-decoration: none; }
.toc-side a:hover { color: var(--color-text); text-decoration: underline; }
.toc-side a[aria-current="true"] { color: var(--color-text); font-weight: 650; }
.toc-btn { font: inherit; font-size: var(--text-sm); color: var(--color-muted); background: none; border: 0; padding: 0.2em 0; cursor: pointer; text-decoration: underline; text-underline-offset: 0.2em; text-decoration-color: var(--color-border); }
.toc-btn:hover { color: var(--color-text); text-decoration-color: currentColor; }
.toc-btn:focus-visible { outline: 2px solid var(--color-text); outline-offset: 2px; }
.toc-btn.toc-icon {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.4em; width: auto; height: 1.4rem; padding: 0 0.15em;
  text-decoration: none; color: var(--color-muted);
  background: none; border: 0; border-radius: 0;
  font-variant-caps: all-small-caps; letter-spacing: 0.06em; font-weight: 650;
}
.toc-btn.toc-icon:hover,
.toc-btn.toc-icon:focus-visible { color: var(--color-text); text-decoration: none; }
.toc-btn.toc-icon:focus-visible { outline: 1px solid var(--color-text); outline-offset: 2px; }
.toc-btn.toc-icon svg { display: block; width: 20px; height: 20px; flex: none; overflow: visible; }
.toc-btn[hidden], .toc-scrim[hidden] { display: none; }
.toc-close, .toc-open, .toc-btn.toc-icon.toc-open { display: none; }

@media (min-width: 1000px) {
  /* Sidebar + gap + reading column are one tight group, centered in the
     viewport so leftover space is equal on both sides. The gap stays fixed;
     it never stretches. When the sidebar is hidden the text recenters, with
     the toggle tucked beside it. */
  .layout.has-toc {
    display: grid;
    column-gap: var(--space-6);
    align-items: start;
    justify-content: center;
    width: 100%;
    padding-left: var(--space-6);
    padding-right: var(--space-6);
  }
  .layout.has-toc > main { grid-row: 1; margin: 0; max-width: var(--measure); width: 100%; }
  .layout.has-toc > .toc-side {
    grid-row: 1;
    position: sticky;
    top: var(--space-6);
    max-height: calc(100vh - 2 * var(--space-6));
    overflow-y: auto;
    margin: 0;
    padding-top: 0;
  }
  .layout.toc-left { grid-template-columns: var(--toc-width) minmax(0, var(--measure)); }
  .layout.toc-left > .toc-side { grid-column: 1; }
  .layout.toc-left > main { grid-column: 2; }
  .layout.toc-right { grid-template-columns: minmax(0, var(--measure)) var(--toc-width); }
  .layout.toc-right > main { grid-column: 1; }
  .layout.toc-right > .toc-side { grid-column: 2; }
  .layout.toc-collapsed { grid-template-columns: 1fr minmax(0, var(--measure)) 1fr; }
  .layout.toc-collapsed > main { grid-column: 2; }
  .layout.toc-left.toc-collapsed > .toc-side { grid-column: 1; justify-self: end; width: auto; max-height: none; overflow: visible; }
  .layout.toc-right.toc-collapsed > .toc-side { grid-column: 3; justify-self: start; width: auto; max-height: none; overflow: visible; }
  .layout.toc-collapsed > .toc-side .toc-title { display: none; }
  .layout.toc-collapsed > .toc-side .toc-head { margin: 0; }
  .layout.toc-left.toc-collapsed > .toc-side .toc-head { justify-content: flex-end; }
  .layout.toc-right.toc-collapsed > .toc-side .toc-head { justify-content: flex-start; }
}

@media (max-width: 999.98px) {
  .js .layout.has-toc > .toc-side { position: fixed; top: 0; bottom: 0; z-index: 30; width: min(20rem, 86vw); margin: 0; padding: var(--space-5); overflow-y: auto; background: var(--color-surface); box-shadow: 0 0 32px rgb(0 0 0 / 0.18); visibility: hidden; transform: translateX(100%); transition: transform 0.18s ease, visibility 0s linear 0.18s; }
  .js .layout.toc-right > .toc-side { right: 0; }
  .js .layout.toc-left > .toc-side { left: 0; transform: translateX(-100%); }
  .js.toc-panel-open .layout.has-toc > .toc-side { visibility: visible; transform: none; transition: transform 0.18s ease; }
  .js .toc-btn.toc-icon.toc-toggle { display: none; }
  .js .toc-close { display: inline; }
  .js .toc-btn.toc-icon.toc-open { display: inline-flex; position: fixed; top: var(--space-3); right: var(--space-3); left: auto; z-index: 20; background: none; width: auto; height: auto; padding: 0.15em 0.2em; justify-content: flex-start; }
  .js .toc-btn.toc-icon.toc-open.at-left { right: auto; left: var(--space-3); }
  .toc-scrim { position: fixed; inset: 0; z-index: 25; background: rgb(0 0 0 / 0.28); }
  .toc-side a { padding: 0.45em 0; }
  .js .layout.has-toc { padding-top: var(--space-7); }
}
@media (prefers-reduced-motion: reduce) {
  .toc-side { transition: none !important; }
}

@media (max-width: 640px) {
  .idea-grid { grid-template-columns: 1fr; }
  .idea-grid > .idea:last-child:nth-child(odd):not(:first-child) dl { display: block; }
  html { font-size: 16px; }
  .layout { padding: var(--space-6) var(--space-4) var(--space-7); }
  .toc ol { columns: 1; }
}

/* ---------- Print ---------- */
@media print {
  /* Beat the dark selectors, which are (0, 2, 0). Screen media already
     keeps them off the page; these values cover a dark preference anyway. */
  :root,
  :root:not([data-theme="light"]),
  :root[data-theme="dark"] {
    color-scheme: light;
    --color-bg: #fbfaf7;
    --color-surface: #ffffff;
    --color-surface-2: #f3f1ec;
    --color-text: #1c1b19;
    --color-muted: #66625a;
    --color-border: #e3dfd6;
    --color-accent: #3a52c8;
    --color-accent-ink: #ffffff;
    --color-has: #1f7a4d;
    --color-partial: #9a5b06;
    --color-missing: #b3261e;
    --color-sourced: #2b6688;
    --color-judgment: #6f45a8;
    --color-placeholder: #806200;
    --color-code-bg: #f3f1ec;
    --shadow: none;
  }
  html { font-size: 11pt; }
  main { max-width: none; padding: 0; }
  .layout { display: block !important; padding: 0; }
  .toc-side, .toc-open, .toc-scrim { display: none !important; }
  .toc { display: none; }
  h2, h3, .caption { break-after: avoid; }
  .idea, figure.diagram, figure.quote, .lead, tr, ol.ranked > li, ol.invariants > li { break-inside: avoid; }
  .idea-grid { display: block; }
  .idea { margin-bottom: var(--space-3); }
  ul.sources a::after { content: " (" attr(href) ")"; color: var(--color-muted); word-break: break-all; }
  a { color: inherit; }
}

/* ---------- Opt-in styles (never used by the Nessa default) ----------
   Turned on only by a user or project theme through [components.style]. */
html[data-labels="badge"] .provenance { display: inline-block; font-style: normal; font-size: var(--text-xs); font-weight: 600; line-height: 1; padding: 0.3em 0.6em; border-radius: 999px; vertical-align: 0.12em; }
html[data-labels="badge"] .caption > .provenance::after { content: none; }
html[data-labels="badge"] .provenance-sourced { color: var(--color-sourced); background: var(--color-sourced-soft); }
html[data-labels="badge"] .provenance-judgment { color: var(--color-judgment); background: var(--color-judgment-soft); }
html[data-labels="badge"] .provenance-placeholder { color: var(--color-placeholder); background: var(--color-placeholder-soft); }
html[data-status="pill"] .status { display: inline-flex; align-items: center; gap: 0.35em; font-size: var(--text-xs); padding: 0.3em 0.6em; border-radius: 999px; }
html[data-status="pill"] .status::before { content: ""; width: 0.5em; height: 0.5em; border-radius: 50%; background: currentColor; }
html[data-status="pill"] .status-has { color: var(--color-has); background: var(--color-has-soft); }
html[data-status="pill"] .status-partial { color: var(--color-partial); background: var(--color-partial-soft); }
html[data-status="pill"] .status-missing { color: var(--color-missing); background: var(--color-missing-soft); }
html[data-ranks="circle"] ol.ranked > li { padding-left: 3.1rem; }
html[data-ranks="circle"] ol.ranked > li::before { content: counter(rank); width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; font-size: var(--text-sm); color: var(--color-accent-ink); background: var(--color-accent); }
html[data-markers="symbol"] ul.risks > li::marker { content: "!  "; color: var(--color-partial); font-weight: 700; }
html[data-markers="symbol"] ul.questions > li::marker { content: "?  "; color: var(--color-sourced); font-weight: 700; }
html[data-markers="symbol"] ul.skip > li::marker { content: "\00d7  "; color: var(--color-missing); font-weight: 700; }
html[data-callout="bar"] .lead { border-left: 4px solid var(--color-accent); background: var(--color-accent-soft); }
html[data-callout="tint"] .lead { background: var(--color-accent-soft); border-color: transparent; }
</style>
